services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: auditlab
      MYSQL_USER: auditlab
      MYSQL_PASSWORD: auditlab
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://auditlab:auditlab@database:3306/auditlab?serverVersion=8.4.0&charset=utf8mb4
      MYSQL_HOST: database
      MYSQL_DATABASE: auditlab
      MYSQL_USER: auditlab
      MYSQL_PASSWORD: auditlab
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - vendor_data:/app/vendor
    command: ["sh", "docker/start.sh"]

volumes:
  mysql_data:
  vendor_data:
