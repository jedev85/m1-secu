parameters:
  uploads_dir: '%kernel.project_dir%/public/uploads'
  invoices_dir: '%kernel.project_dir%/var/invoices'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    bind:
      string $uploadsDir: '%uploads_dir%'
      string $invoicesDir: '%invoices_dir%'
      string $projectDir: '%kernel.project_dir%'

  App\:
    resource: '../src/'
    exclude:
      - '../src/Entity/'
      - '../src/Kernel.php'
